name: security
on: [push, pull_request]

jobs:
  secrets:
    name: Secret scan (Gitleaks) - GATE
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # gitleaks needs history
      - name: Secret scan
        run: |
          docker run -v "${{ github.workspace }}:/repo" zricethezav/gitleaks:latest \
            detect --source /repo --config /repo/.gitleaks.toml --exit-code 1 --redact -v

  sast:
    name: SAST (Semgrep) - GATE
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: SAST scan
        run: |
          pip install semgrep
          semgrep scan --config auto --error

  deps:
    name: Dependency scan (Trivy) - REPORT
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependency scan
        run: |
          docker run -v "${{ github.workspace }}:/repo" aquasec/trivy:latest \
            fs --scanners vuln --exit-code 0 /repo
