name: security

on:
  push:
  pull_request:          # NOT pull_request_target: fork PRs get a read-only token and no secrets

# Least privilege: token starts with NO permissions; each job gets only what it needs.
permissions: {}

jobs:
  secrets:
    name: Secret scan (Gitleaks) - GATE
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0             # gitleaks scans full history
          persist-credentials: false # don't leave the token in .git/config
      - name: Install Gitleaks 8.30.1 (checksum-verified)
        run: |
          curl -sSfL -o gitleaks.tgz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
      - name: Secret scan
        run: ./gitleaks detect --source . --config .gitleaks.toml --exit-code 1 --redact -v

  sast:
    name: SAST (Semgrep) - GATE
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install Semgrep 1.186.0 (pinned)
        run: pip install semgrep==1.186.0
      - name: SAST scan
        run: semgrep scan --config auto --error

  deps:
    name: Dependency scan (Trivy) - REPORT
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install Trivy 0.76.2 (checksum-verified)
        run: |
          curl -sSfL -o trivy.tgz \
            https://github.com/aquasecurity/trivy/releases/download/v0.76.2/trivy_0.76.2_Linux-64bit.tar.gz
          echo "bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf  trivy.tgz" | sha256sum -c -
          tar xzf trivy.tgz trivy
      - name: Dependency scan
        run: ./trivy fs --scanners vuln --exit-code 0 --skip-dirs .git .
